services:
  - type: web
    name: testpilot-ai-api
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npx playwright install --with-deps chromium || npx playwright install chromium; npm run build:server
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: PLAYWRIGHT_HEADLESS
        value: true
      - key: ENABLE_TEST_EXECUTION
        value: "false"
      - key: NODE_VERSION
        value: "20"

  - type: static
    name: testpilot-ai-web
    env: static
    plan: free
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://testpilot-ai-api.onrender.com/api
