services:
  - type: web
    runtime: node
    name: testpilot-ai-api
    plan: free
    buildCommand: npm ci --include=dev && ./node_modules/.bin/playwright install --with-deps chromium || ./node_modules/.bin/playwright install chromium; npm run build:server
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: PLAYWRIGHT_HEADLESS
        value: true
      - key: ENABLE_TEST_EXECUTION
        value: "true"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright
      - key: EXECUTION_ACCESS_TOKEN
        sync: false
      - key: NODE_VERSION
        value: "20"

  - type: web
    runtime: static
    name: testpilot-ai-web
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://testpilot-ai-api.onrender.com/api

